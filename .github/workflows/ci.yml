name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    # The backend queries the Soroban contract — these dummy values prevent
    # config/env.ts from throwing at startup during build/typecheck.
    # No real network calls are made during lint, typecheck, or tsc compilation.
    env:
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      MARKET_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABSC4
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned to match local dev. Update deliberately when upgrading.
          version: 10

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          # Falls back to any prior pnpm cache for this OS if lockfile changes.
          # Switch to --frozen-lockfile below once pnpm-lock.yaml is committed.
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
